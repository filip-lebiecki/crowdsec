<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404s Are the Signal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090d14;
    --panel: #101823;
    --panel2: #152130;
    --line: #243244;
    --text: #e8eef5;
    --muted: #8a9ab0;
    --dim: #5b6b80;
    --log: #5fd4e6;
    --ok: #6fe08a;
    --warn: #f2b45e;
    --bad: #ff7a6b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { fill: var(--muted); }
  .dim { fill: var(--dim); }
  .caps { font-size: 12px; letter-spacing: 2.4px; font-weight: 600; }

  .lane { stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
  .logline { transition: transform .3s ease, opacity .3s ease; animation: logIn .35s ease; }
  @keyframes logIn { from { opacity: 0; } }
  .hit { animation: hit .6s ease; }
  @keyframes hit { 0% { fill: var(--text); } 100% { } }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-opacity: .35; } }
  .fw { transition: opacity .35s ease; }

  [data-step] { transition: opacity .45s ease; }
  .hidden { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .logline, .hit, .pulse { animation: none; transition: none; }
  }
</style>
</head>
<body>
<svg id="root" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Why returning 404 for unknown paths matters to CrowdSec. The same ffuf scanner hits two apps with paths like /.env, /admin and /wp-login.php. On the left, a catch-all app (whoami's default) answers every path with 200 OK, so the access log shows only 200s, the http-probing bucket for the scanner's IP never gets a drop, and the scanner looks exactly like a normal visitor. On the right, Caddy proxies only / to whoami and answers everything else with respond 404; every 404 on a new path adds a drop to the scanner's http-probing bucket, which has capacity 10. On the eleventh 404 the bucket overflows, an alert fires and the scanner's IP is banned for 4 hours; its later requests are dropped by the firewall. Answer 200 for everything and there is no signal; return 404 for garbage and probing becomes visible.">
  <defs>
    <linearGradient id="gBad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22161a"/><stop offset="1" stop-color="#10141c"/>
    </linearGradient>
    <linearGradient id="gGood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13281c"/><stop offset="1" stop-color="#0e1a15"/>
    </linearGradient>
    <clipPath id="bucketClip"><path d="M560 470 L572 586 L652 586 L664 470 Z"/></clipPath>
  </defs>

  <!-- ============ HEADER ============ -->
  <g>
    <text x="60" y="78" class="caps" style="fill:var(--warn)">CROWDSEC LAB · WEB SCENARIOS</text>
    <text x="60" y="130" font-size="42" font-weight="600" letter-spacing="-1">404s are the signal</text>

    <text x="1540" y="78" font-size="14" class="muted" text-anchor="end">same ffuf scan · two apps</text>
    <g transform="translate(1196,112)">
      <rect x="0" y="-11" width="40" height="22" rx="11" fill="var(--ok)" fill-opacity=".18" stroke="var(--ok)"/>
      <text x="20" y="4.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="var(--ok)">200</text>
      <text x="48" y="5" font-size="14" class="muted">OK</text>
      <rect x="90" y="-11" width="40" height="22" rx="11" fill="var(--warn)" fill-opacity=".18" stroke="var(--warn)"/>
      <text x="110" y="4.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="var(--warn)">404</text>
      <text x="138" y="5" font-size="14" class="muted">not found</text>
      <circle cx="232" cy="0" r="5" fill="var(--warn)"/>
      <text x="244" y="5" font-size="14" class="muted">drop</text>
    </g>
  </g>

  <!-- ============ PANELS (built by script below) ============ -->
  <g id="pL" data-step="1" transform="translate(60,190)"></g>
  <g id="pR" data-step="2" transform="translate(820,190)"></g>

  <!-- ============ TAKEAWAY ============ -->
  <g data-step="3">
    <text x="800" y="856" font-size="24" font-weight="600" text-anchor="middle">
      <tspan fill="var(--bad)">200 for everything</tspan><tspan class="muted"> = no signal.</tspan>
      <tspan dx="28" fill="var(--warn)">404 for garbage</tspan><tspan class="muted"> = someone is probing.</tspan>
    </text>
  </g>
</svg>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const IP_V = "198.51.100.23", IP_S = "129.159.240.98";
  const CAP = 10, PER_DROP = 10, BOTTOM = 586;

  const h = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const wait = ms => RM ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const tween = (ms, fn) => {
    if (RM) { fn(1); return Promise.resolve(); }
    return new Promise(res => {
      const t0 = performance.now();
      const step = now => { const p = Math.min(1, (now - t0) / ms); fn(p); p < 1 ? requestAnimationFrame(step) : res(); };
      requestAnimationFrame(step);
    });
  };
  const fadeLabel = (parent, x, y, text, color, ms = 900) => {
    const t = h("text", { x, y, "font-size": 12, "text-anchor": "middle", fill: color }, parent, text);
    tween(ms, p => t.setAttribute("opacity", p < .2 ? p / .2 : 1 - (p - .2) / .8)).then(() => t.remove());
  };

  // ---------------------------------------------------------------- panel
  function Panel(cfg) {
    const g = document.getElementById(cfg.id);
    const P = { mode: cfg.mode, count: 0, level: 0, banned: false, overflowed: false, lines: [] };

    h("rect", { x: 0, y: 0, width: 720, height: 610, rx: 18, fill: `url(#${cfg.grad})`, stroke: cfg.stroke }, g);
    h("text", { x: 24, y: 40, class: "caps", fill: cfg.capsColor }, g, cfg.caps);
    h("text", { x: 24, y: 76, "font-size": 26, "font-weight": 600 }, g, cfg.title);
    h("text", { x: 24, y: 104, "font-size": cfg.subMono ? 12.5 : 14, class: cfg.subMono ? "mono muted" : "muted" }, g, cfg.sub);

    // clients
    const client = (y, dot, name, ip) => {
      const box = h("rect", { x: 24, y, width: 176, height: 50, rx: 10, fill: "var(--panel2)", stroke: "var(--line)" }, g);
      h("circle", { cx: 44, cy: y + 25, r: 5, fill: dot }, g);
      h("text", { x: 58, y: y + 21, "font-size": 15, "font-weight": 600 }, g, name);
      h("text", { x: 58, y: y + 39, "font-size": 11.5, class: "mono muted" }, g, ip);
      return box;
    };
    client(130, "var(--log)", "visitor", IP_V);
    P.scanBox = client(190, "var(--bad)", "scanner · ffuf", IP_S);
    h("line", { x1: 206, y1: 155, x2: 504, y2: 155, class: "lane" }, g);
    h("line", { x1: 206, y1: 215, x2: 504, y2: 215, class: "lane" }, g);

    // app box
    h("rect", { x: 510, y: 130, width: 186, height: 110, rx: 12, fill: "#0d141d", stroke: "var(--line)" }, g);
    h("text", { x: 528, y: 157, class: "caps", fill: cfg.appColor }, g, cfg.appCaps);
    P.appLines = cfg.appLines.map((s, i) =>
      h("text", { x: 528, y: 190 + i * 26, "font-size": 13, class: "mono muted" }, g, s));

    // firewall (shown after the ban)
    P.fw = h("g", { class: "fw", opacity: 0 }, g);
    h("line", { x1: 300, y1: 196, x2: 300, y2: 234, stroke: "var(--bad)", "stroke-width": 3, "stroke-linecap": "round" }, P.fw);
    h("text", { x: 300, y: 186, "font-size": 11, "text-anchor": "middle", fill: "var(--bad)", class: "caps" }, P.fw, "FIREWALL");
    h("rect", { x: 128, y: 181, width: 64, height: 18, rx: 9, fill: "var(--bad)" }, P.fw);
    h("text", { x: 160, y: 194, "font-size": 10.5, "font-weight": 700, "text-anchor": "middle", fill: "#1a0d0d", "letter-spacing": 1 }, P.fw, "BANNED");

    P.flow = h("g", {}, g);

    // access log
    h("rect", { x: 24, y: 262, width: 672, height: 190, rx: 12, fill: "#0a0f16", stroke: "var(--line)" }, g);
    const lbl = h("text", { x: 42, y: 288, class: "caps muted" }, g, "ACCESS.LOG");
    h("tspan", { class: "dim", "letter-spacing": 0, "font-weight": 400, "font-size": 13 }, lbl, "   what CrowdSec reads");
    P.logG = h("g", {}, g);

    // bucket text
    h("text", { x: 42, y: 494, class: "caps muted" }, g, "BUCKET · HTTP-PROBING · SCANNER IP");
    h("text", { x: 42, y: 516, "font-size": 13, class: "dim" }, g, "counts 404s on distinct paths · capacity 10");
    const ctr = h("text", { x: 42, y: 560, "font-size": 36, "font-weight": 600, class: "mono" }, g);
    P.ctr = h("tspan", {}, ctr, "0");
    h("tspan", { class: "dim", "font-size": 22 }, ctr, " / 10");
    P.state = h("text", { x: 42, y: 590, "font-size": 15 }, g);

    // bucket graphic
    P.fill = h("rect", { x: 550, y: BOTTOM, width: 124, height: 0, fill: "var(--warn)", "fill-opacity": .5, "clip-path": "url(#bucketClip)" }, g);
    h("line", { x1: 556, y1: BOTTOM - CAP * PER_DROP, x2: 668, y2: BOTTOM - CAP * PER_DROP, stroke: "var(--dim)", "stroke-dasharray": "4 4" }, g);
    h("text", { x: 676, y: BOTTOM - CAP * PER_DROP + 4, "font-size": 11, class: "dim" }, g, "10");
    P.bucket = h("path", { d: "M560 470 L572 586 L652 586 L664 470", fill: "none", stroke: "var(--muted)", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);

    P.setState = (txt, color) => { P.state.textContent = txt; P.state.setAttribute("fill", color || "var(--muted)"); };

    P.addLog = (ip, path, status) => {
      const lg = h("g", { class: "logline" });
      lg.style.transform = "translate(0px, 432px)";
      P.logG.appendChild(lg);
      h("text", { x: 42, y: 0, "font-size": 13, class: "mono muted" }, lg, ip);
      h("text", { x: 184, y: 0, "font-size": 13, class: "mono" }, lg, "GET " + path);
      h("text", { x: 678, y: 0, "font-size": 13, "font-weight": 700, "text-anchor": "end", class: "mono",
                  fill: status === "200" ? "var(--ok)" : "var(--warn)" }, lg, status);
      P.lines.push(lg);
      if (P.lines.length > 7) P.lines.shift().remove();
      const n = P.lines.length;
      P.lines.forEach((l, i) => {
        l.style.transform = `translate(0px, ${432 - (n - 1 - i) * 20}px)`;
        l.style.opacity = (0.3 + 0.7 * (i + 1) / n).toFixed(2);
      });
    };

    P.setLevel = (target, color) => {
      const from = P.level;
      P.level = target;
      if (color) P.fill.setAttribute("fill", color);
      return tween(260, p => {
        const v = from + (target - from) * ease(p);
        P.fill.setAttribute("y", BOTTOM - v);
        P.fill.setAttribute("height", v);
      });
    };

    P.drop = async () => {
      if (P.overflowed) return;
      const d = h("circle", { r: 5, fill: "var(--warn)" }, g);
      const ty = BOTTOM - Math.min(P.count + 1, CAP) * PER_DROP + 4;
      await tween(480, p => { const e = p * p; d.setAttribute("cx", 664 - 52 * e); d.setAttribute("cy", 438 + (ty - 438) * e); });
      d.remove();
      P.count++;
      P.ctr.textContent = P.count;
      if (P.count > CAP) return P.overflow();
      P.setLevel(P.count * PER_DROP);
    };

    P.overflow = async () => {
      P.overflowed = true;
      P.ctr.textContent = P.count;
      P.ctr.setAttribute("fill", "var(--bad)");
      P.bucket.setAttribute("stroke", "var(--bad)");
      P.bucket.classList.add("pulse");
      P.setLevel(116, "var(--bad)");
      for (const [x, dx] of [[562, -22], [662, 22], [566, -10]]) {
        const s = h("circle", { r: 4, fill: "var(--bad)" }, g);
        tween(700, p => { s.setAttribute("cx", x + dx * p); s.setAttribute("cy", 470 + 60 * p * p); s.setAttribute("opacity", 1 - p); })
          .then(() => s.remove());
      }
      P.setState("overflow → ALERT http-probing → ban 4h", "var(--bad)");
      await wait(700);
      P.banned = true;
      P.fw.setAttribute("opacity", 1);
      P.scanBox.setAttribute("stroke", "var(--bad)");
    };

    P.reset = () => {
      P.lines.forEach(l => l.remove()); P.lines = [];
      P.count = 0; P.ctr.textContent = "0"; P.ctr.removeAttribute("fill");
      P.overflowed = false; P.banned = false;
      P.bucket.setAttribute("stroke", "var(--muted)"); P.bucket.classList.remove("pulse");
      P.fw.setAttribute("opacity", 0);
      P.scanBox.setAttribute("stroke", "var(--line)");
      P.setLevel(0, "var(--warn)");
      P.setState(cfg.idle, cfg.idleColor);
    };

    P.fire = async req => {
      const scanner = req.who === "s";
      const y = scanner ? 215 : 155;
      const status = P.mode === "200" || req.path === "/" ? "200" : "404";
      const w = req.path.length * 7.6 + 18;
      const chip = h("g", {}, P.flow);
      const cr = h("rect", { x: 0, y: -11, width: w, height: 22, rx: 6, fill: "#0d141d", stroke: scanner ? "var(--bad)" : "var(--log)", "stroke-opacity": .85 }, chip);
      h("text", { x: 9, y: 4.5, "font-size": 12.5, class: "mono" }, chip, req.path);
      const x0 = 208;

      if (scanner && P.banned) {           // dropped at the firewall, never logged
        const xb = 294 - w;
        await tween(Math.max(160, (xb - x0) * 2.2), p => chip.setAttribute("transform", `translate(${x0 + (xb - x0) * ease(p)},${y})`));
        cr.setAttribute("fill", "#2a1214");
        fadeLabel(P.flow, 350, y + 4, "✕ dropped", "var(--bad)", 700);
        await tween(450, p => chip.setAttribute("opacity", 1 - p));
        chip.remove();
        return;
      }

      const x1 = 504 - w;
      await tween(420, p => chip.setAttribute("transform", `translate(${x0 + (x1 - x0) * ease(p)},${y})`));
      chip.remove();

      const line = P.appLines[P.mode === "404" && status === "404" ? 1 : 0];
      line.classList.remove("hit"); void line.getBBox(); line.classList.add("hit");

      const col = status === "200" ? "var(--ok)" : "var(--warn)";
      const pill = h("g", {}, P.flow);
      h("rect", { x: 0, y: -11, width: 44, height: 22, rx: 11, fill: col, "fill-opacity": .18, stroke: col }, pill);
      h("text", { x: 22, y: 4.5, "text-anchor": "middle", "font-size": 12.5, "font-weight": 700, class: "mono", fill: col }, pill, status);
      const back = tween(400, p => {
        pill.setAttribute("transform", `translate(${460 - 252 * ease(p)},${y})`);
        pill.setAttribute("opacity", p > .75 ? (1 - p) / .25 : 1);
      }).then(() => pill.remove());

      P.addLog(scanner ? IP_S : IP_V, req.path, status);
      if (status === "404") await P.drop();
      else if (scanner) fadeLabel(g, 470, 540, "200 · not counted", "var(--muted)", 1000);
      await back;
    };

    P.setState(cfg.idle, cfg.idleColor);
    return P;
  }

  const L = Panel({
    id: "pL", mode: "200", grad: "gBad", stroke: "#4a2a2e",
    caps: "CATCH-ALL 200", capsColor: "var(--bad)",
    title: "Every path → 200 OK",
    sub: "whoami's default · many SPAs · apps that redirect everything to /login",
    appCaps: "WHOAMI", appColor: "var(--muted)",
    appLines: ["any path", "→ 200 OK"],
    idle: "no 404s → the scanner looks like a visitor", idleColor: "var(--bad)"
  });
  const R = Panel({
    id: "pR", mode: "404", grad: "gGood", stroke: "#2c5a3e",
    caps: "UNKNOWN PATH → 404", capsColor: "var(--ok)",
    title: "Only real paths get a 200",
    sub: "handle / { reverse_proxy whoami:80 }   handle { respond 404 }", subMono: true,
    appCaps: "CADDY", appColor: "var(--ok)",
    appLines: ["/  → whoami · 200", "*  → respond 404"],
    idle: "each 404 on a new path adds a drop", idleColor: "var(--muted)"
  });

  const S = p => ({ who: "s", path: p }), V = { who: "v", path: "/" };
  const SEQ = [
    V, S("/.env"), S("/admin"), S("/wp-login.php"), V,
    S("/.git/config"), S("/backup.zip"), S("/phpmyadmin/"), V,
    S("/config.php"), S("/server-status"), S("/.aws/credentials"),
    S("/xmlrpc.php"), S("/api/debug"),                     // 11th 404 → overflow
    V, S("/login.php"), S("/.DS_Store"), S("/vendor/"), V, S("/cgi-bin/")
  ];

  async function run() {
    for (;;) {
      for (const req of SEQ) {
        while (document.hidden) await new Promise(r => setTimeout(r, 400));
        L.fire(req); R.fire(req);
        await wait(760);
      }
      if (RM) return;                       // reduced motion: stop on the final state
      await wait(3800);
      L.reset(); R.reset();
      await wait(900);
    }
  }
  run();

  // Default: everything visible. Add ?build to reveal one step per click / → / space (← goes back).
  if (!new URLSearchParams(location.search).has("build")) return;
  const groups = [...document.querySelectorAll("[data-step]")];
  const max = Math.max(...groups.map(g => +g.dataset.step));
  let step = 0;
  const render = () => groups.forEach(g => g.classList.toggle("hidden", +g.dataset.step > step));
  const go = d => { step = Math.min(max, Math.max(0, step + d)); render(); };
  addEventListener("click", () => go(1));
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
    if (e.key === "ArrowLeft") go(-1);
  });
  render();
})();
</script>
</body>
</html>
