<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exposure Tiers</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090d14;
    --panel: #101823;
    --panel2: #152130;
    --line: #243244;
    --text: #e8eef5;
    --muted: #8a9ab0;
    --dim: #5b6b80;
    --vpn: #5fd4e6;
    --cf: #b39dff;
    --direct: #f2b45e;
    --good: #6fe08a;
    --bad: #ff7a6b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { fill: var(--muted); }
  .dim { fill: var(--dim); }
  .caps { font-size: 12px; letter-spacing: 2.4px; font-weight: 600; }

  .chip rect { fill: var(--panel2); }
  .chip text { font-size: 14px; text-anchor: middle; }
  .pro { font-size: 14.5px; }
  .pro tspan.m { fill: var(--good); font-weight: 700; }
  .con { font-size: 14.5px; }
  .con tspan.m { fill: var(--bad); font-weight: 700; }

  [data-step] { transition: opacity .45s ease; }
  .hidden { opacity: 0; }
</style>
</head>
<body>
<svg id="root" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="What to expose, and how. Tier 1, VPN only with WireGuard on the MikroTik: Jupyter, Postgres, mailpit, SSH, router admin and dashboards; invisible to scanners and nothing to brute-force, but every device needs the VPN client. Tier 2, Cloudflare Tunnel plus Access: Open WebUI, Home Assistant, authentik, ntfy, SearXNG and Bitwarden; home IP hidden, no open ports, DDoS absorbed, but Cloudflare decrypts the traffic, uploads are capped at 100 MB on the free plan and video streaming is not allowed; protected by Cloudflare Access, with a CrowdSec bouncer at Cloudflare's edge coming in part 3. Tier 3, direct with CrowdSec: only when tiers 1 and 2 can't do the job: Garage S3 for big uploads, Jellyfin for video streaming, a game server and a mail server for non-HTTP; the real client IP is visible so CrowdSec sees the attacker, but the home IP is public and gets scanned within minutes; protected by the nftables bouncer on the server, with the router joining in part 2. Pick per service.">
  <defs>
    <linearGradient id="gVpn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132232"/><stop offset="1" stop-color="#0e1620"/>
    </linearGradient>
    <linearGradient id="gCf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1830"/><stop offset="1" stop-color="#10141f"/>
    </linearGradient>
    <linearGradient id="gDirect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231d15"/><stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <symbol id="lock" viewBox="0 0 24 24">
      <rect x="4.5" y="10.5" width="15" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 24 24">
      <path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.4 4.6 4.6 0 0 0 7 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M3 12h18M5 7h14M5 17h14" stroke="currentColor" stroke-width="1.2"/>
    </symbol>
  </defs>

  <!-- ============ HEADER ============ -->
  <g>
    <text x="60" y="78" class="caps" style="fill:var(--direct)">CROWDSEC LAB · WRAP-UP</text>
    <text x="60" y="130" font-size="42" font-weight="600" letter-spacing="-1">What to expose, and how</text>
  </g>

  <!-- ============ TIER 1 · VPN ONLY ============ -->
  <g data-step="1">
    <rect x="60" y="180" width="480" height="580" rx="18" fill="url(#gVpn)" stroke="#23405a"/>
    <text x="88" y="218" class="caps" style="fill:var(--vpn)">TIER 1 · VPN ONLY</text>
    <use href="#lock" x="88" y="238" width="44" height="44" style="color:var(--vpn)"/>
    <text x="146" y="266" font-size="28" font-weight="600">WireGuard</text>
    <text x="146" y="290" font-size="14" class="muted">on the MikroTik</text>

    <text x="88" y="338" class="caps dim" font-size="10.5">FOR</text>
    <g class="chip" style="--c:#1f4a58">
      <rect x="88"  y="352" width="206" height="36" rx="9" stroke="#1f4a58"/><text x="191" y="375" class="mono">Jupyter</text>
      <rect x="306" y="352" width="206" height="36" rx="9" stroke="#1f4a58"/><text x="409" y="375" class="mono">Postgres</text>
      <rect x="88"  y="398" width="206" height="36" rx="9" stroke="#1f4a58"/><text x="191" y="421" class="mono">mailpit</text>
      <rect x="306" y="398" width="206" height="36" rx="9" stroke="#1f4a58"/><text x="409" y="421" class="mono">SSH</text>
      <rect x="88"  y="444" width="206" height="36" rx="9" stroke="#1f4a58"/><text x="191" y="467" class="mono">router admin</text>
      <rect x="306" y="444" width="206" height="36" rx="9" stroke="#1f4a58"/><text x="409" y="467" class="mono">dashboards</text>
    </g>

    <line x1="88" y1="506" x2="512" y2="506" stroke="var(--line)"/>
    <text x="88" y="538" class="pro"><tspan class="m">✓ </tspan>invisible: no reply without a valid key</text>
    <text x="88" y="562" class="pro"><tspan class="m">✓ </tspan>nothing to brute-force</text>
    <text x="88" y="586" class="pro"><tspan class="m">✓ </tspan>no public attack surface at all</text>
    <text x="88" y="622" class="con"><tspan class="m">✗ </tspan>every device needs the VPN client</text>
    <text x="88" y="646" class="con"><tspan class="m">✗ </tspan>not for sharing with other people</text>

    <text x="88" y="702" class="caps dim" font-size="10.5">PROTECTED BY</text>
    <text x="88" y="726" font-size="16" font-weight="600" style="fill:var(--vpn)">the WireGuard key itself</text>
  </g>

  <!-- ============ TIER 2 · CLOUDFLARE TUNNEL ============ -->
  <g data-step="2">
    <rect x="560" y="180" width="480" height="580" rx="18" fill="url(#gCf)" stroke="#3c3466"/>
    <text x="588" y="218" class="caps" style="fill:var(--cf)">TIER 2 · CLOUDFLARE TUNNEL</text>
    <use href="#cloud" x="588" y="238" width="44" height="44" style="color:var(--cf)"/>
    <text x="646" y="266" font-size="28" font-weight="600">Tunnel + Access</text>
    <text x="646" y="290" font-size="14" class="muted">reachable from anywhere</text>

    <text x="588" y="338" class="caps dim" font-size="10.5">FOR</text>
    <g class="chip">
      <rect x="588" y="352" width="206" height="36" rx="9" stroke="#3c3466"/><text x="691" y="375" class="mono">Open WebUI</text>
      <rect x="806" y="352" width="206" height="36" rx="9" stroke="#3c3466"/><text x="909" y="375" class="mono">Home Assistant</text>
      <rect x="588" y="398" width="206" height="36" rx="9" stroke="#3c3466"/><text x="691" y="421" class="mono">authentik</text>
      <rect x="806" y="398" width="206" height="36" rx="9" stroke="#3c3466"/><text x="909" y="421" class="mono">ntfy</text>
      <rect x="588" y="444" width="206" height="36" rx="9" stroke="#3c3466"/><text x="691" y="467" class="mono">SearXNG</text>
      <rect x="806" y="444" width="206" height="36" rx="9" stroke="#3c3466"/><text x="909" y="467" class="mono">Bitwarden</text>
    </g>

    <line x1="588" y1="506" x2="1012" y2="506" stroke="var(--line)"/>
    <text x="588" y="538" class="pro"><tspan class="m">✓ </tspan>home IP hidden, no open ports</text>
    <text x="588" y="562" class="pro"><tspan class="m">✓ </tspan>DDoS absorbed by Cloudflare</text>
    <text x="588" y="586" class="pro"><tspan class="m">✓ </tspan>Access login in front of admin apps</text>
    <text x="588" y="622" class="con"><tspan class="m">✗ </tspan>Cloudflare decrypts your traffic</text>
    <text x="588" y="646" class="con"><tspan class="m">✗ </tspan>uploads capped at 100 MB (free plan)</text>
    <text x="588" y="670" class="con"><tspan class="m">✗ </tspan>no video streaming</text>

    <text x="588" y="702" class="caps dim" font-size="10.5">PROTECTED BY</text>
    <text x="588" y="726" font-size="16" font-weight="600" style="fill:var(--cf)">Cloudflare Access</text>
    <text x="588" y="747" font-size="13" class="dim">+ CrowdSec at the edge · part 3</text>
  </g>

  <!-- ============ TIER 3 · DIRECT ============ -->
  <g data-step="3">
    <rect x="1060" y="180" width="480" height="580" rx="18" fill="url(#gDirect)" stroke="#5a4830"/>
    <text x="1088" y="218" class="caps" style="fill:var(--direct)">TIER 3 · DIRECT + CROWDSEC</text>
    <use href="#globe" x="1088" y="238" width="44" height="44" style="color:var(--direct)"/>
    <text x="1146" y="266" font-size="28" font-weight="600">Port-forward</text>
    <text x="1146" y="290" font-size="14" class="muted">only when tiers 1 and 2 can't</text>

    <text x="1088" y="338" class="caps dim" font-size="10.5">FOR</text>
    <g class="chip">
      <rect x="1088" y="352" width="206" height="36" rx="9" stroke="#5a4830"/><text x="1191" y="375" class="mono">Garage (S3)</text>
      <rect x="1306" y="352" width="206" height="36" rx="9" stroke="#5a4830"/><text x="1409" y="375" class="mono">Jellyfin</text>
      <rect x="1088" y="398" width="206" height="36" rx="9" stroke="#5a4830"/><text x="1191" y="421" class="mono">game server</text>
      <rect x="1306" y="398" width="206" height="36" rx="9" stroke="#5a4830"/><text x="1409" y="421" class="mono">mail server</text>
    </g>
    <text x="1088" y="466" font-size="12.5" class="dim">big uploads · video streaming · non-HTTP</text>
    <line x1="1088" y1="506" x2="1512" y2="506" stroke="var(--line)"/>
    <text x="1088" y="538" class="pro"><tspan class="m">✓ </tspan>real client IP → CrowdSec sees the attacker</text>
    <text x="1088" y="562" class="pro"><tspan class="m">✓ </tspan>no size limits, any protocol</text>
    <text x="1088" y="586" class="pro"><tspan class="m">✓ </tspan>uploads over 100 MB, video streaming</text>
    <text x="1088" y="622" class="con"><tspan class="m">✗ </tspan>your home IP is public</text>
    <text x="1088" y="646" class="con"><tspan class="m">✗ </tspan>scanned within minutes (CT logs)</text>
    <text x="1088" y="670" class="con"><tspan class="m">✗ </tspan>you patch it (Jellyfin has had serious bugs)</text>

    <text x="1088" y="702" class="caps dim" font-size="10.5">PROTECTED BY</text>
    <text x="1088" y="726" font-size="16" font-weight="600" style="fill:var(--direct)">CrowdSec + nftables bouncer</text>
    <text x="1088" y="747" font-size="13" class="dim">+ the router as a wall · part 2</text>
  </g>

  <!-- ============ 4 · THE RULE ============ -->
  <g data-step="4">
    <rect x="60" y="790" width="1480" height="62" rx="14" fill="var(--panel)" stroke="var(--line)"/>
    <text x="800" y="828" font-size="20" text-anchor="middle"><tspan font-weight="600">Pick per service.</tspan><tspan class="muted"> Expose less, and let CrowdSec guard what's left.</tspan></text>
  </g>
</svg>

<script>
  // Default: everything visible. Add ?build to reveal one step per click / → / space (← goes back).
  (function () {
    if (!new URLSearchParams(location.search).has("build")) return;
    const groups = [...document.querySelectorAll("[data-step]")];
    const max = Math.max(...groups.map(g => +g.dataset.step));
    let step = 0;
    const render = () => groups.forEach(g => g.classList.toggle("hidden", +g.dataset.step > step));
    const go = d => { step = Math.min(max, Math.max(0, step + d)); render(); };
    addEventListener("click", () => go(1));
    addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft") go(-1);
    });
    render();
  })();
</script>
</body>
</html>
