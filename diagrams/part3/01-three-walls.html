<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Walls Overview</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090d14;
    --panel: #101823;
    --panel2: #152130;
    --line: #243244;
    --text: #e8eef5;
    --muted: #8a9ab0;
    --dim: #5b6b80;
    --direct: #5fd4e6;
    --cf: #b39dff;
    --router: #f2b45e;
    --good: #6fe08a;
    --bad: #ff7a6b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { fill: var(--muted); }
  .dim { fill: var(--dim); }
  .caps { font-size: 12px; letter-spacing: 2.4px; font-weight: 600; }

  .track    { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .t-direct { stroke: var(--direct); stroke-opacity: .32; }
  .t-cf     { stroke: var(--cf); stroke-opacity: .34; }
  .t-tunnel { stroke: var(--cf); stroke-opacity: .6; stroke-dasharray: 6 6; }

  /* ban decisions flowing out of the engine to each wall */
  .feed { fill: none; stroke: var(--good); stroke-width: 2; stroke-opacity: .75; stroke-dasharray: 6 7;
          stroke-linejoin: round; animation: flow 0.9s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -13; } }

  .badge circle { fill: var(--bad); }
  .badge text { fill: #1f0d0a; font-size: 13px; font-weight: 700; text-anchor: middle; }

  @media (prefers-reduced-motion: reduce) { .feed { animation: none; } }

  /* build mode (?build) */
  [data-step] { transition: opacity .45s ease; }
  .hidden { opacity: 0; }
</style>
</head>
<body>
<svg id="root" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="CrowdSec lab overview. Two doors into the same whoami app behind Caddy. Direct: whoami.linuxcloudhacks.ovh resolves to the WAN IP, traffic passes the MikroTik router (wall 2, RAW drop of banned IPs, port-forward tcp/443) and nftables on the homelab (wall 1) into Caddy on port 443. Via Cloudflare: whoami-cf.linuxcloudhacks.ovh goes to Cloudflare's edge, where a Worker challenges banned IPs with a Turnstile captcha (wall 3), then down an outbound Cloudflare Tunnel to cloudflared and Caddy on port 80, which takes the real IP from CF-Connecting-IP. Caddy writes the access log with the real client IP; the CrowdSec engine reads it, turns scenarios into ban decisions and feeds all three walls through the nftables, MikroTik and Cloudflare Worker bouncers.">
  <defs>
    <linearGradient id="gHome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132232"/><stop offset="1" stop-color="#0e1620"/>
    </linearGradient>
    <linearGradient id="gRouter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231d15"/><stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="gCf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1830"/><stop offset="1" stop-color="#10141f"/>
    </linearGradient>
    <linearGradient id="gEngine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13281c"/><stop offset="1" stop-color="#0e1a15"/>
    </linearGradient>
    <marker id="aFeed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--good)"/>
    </marker>
    <marker id="aLog" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/>
    </marker>
    <symbol id="globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M3 12h18M5 7h14M5 17h14" stroke="currentColor" stroke-width="1.2"/>
    </symbol>
    <symbol id="shield" viewBox="0 0 24 24">
      <path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M8.6 12.2l2.4 2.4 4.4-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- motion paths for the traffic dots -->
    <path id="mDirect" d="M340 232 V640 H620"/>
    <path id="mCf" d="M1220 232 V660 H980"/>
    <path id="mDropDirect" d="M340 232 V300"/>
    <path id="mDropCf" d="M1220 232 V300"/>
  </defs>

  <!-- ============ HEADER ============ -->
  <g>
    <text x="60" y="78" class="caps" style="fill:var(--direct)">CROWDSEC LAB · PART 3</text>
    <text x="60" y="130" font-size="42" font-weight="600" letter-spacing="-1">One detection, three walls</text>
  </g>
  <g data-step="3">
    <circle cx="1010" cy="73" r="5" fill="var(--direct)"/>
    <text x="1024" y="78" font-size="14" class="muted">direct</text>
  </g>
  <g data-step="4">
    <circle cx="1110" cy="73" r="5" fill="var(--cf)"/>
    <text x="1124" y="78" font-size="14" class="muted">via Cloudflare</text>
  </g>
  <g data-step="6">
    <line x1="1262" y1="73" x2="1286" y2="73" stroke="var(--good)" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1296" y="78" font-size="14" class="muted">ban decisions</text>
    <circle cx="1420" cy="73" r="5" fill="var(--bad)"/>
    <text x="1434" y="78" font-size="14" class="muted">banned IP</text>
  </g>

  <!-- ============ 1 · INTERNET + TWO DOORS ============ -->
  <g data-step="1">
    <rect x="60" y="168" width="1480" height="64" rx="14" fill="var(--panel)" stroke="var(--line)"/>
    <use href="#globe" x="742" y="182" width="34" height="34" style="color:var(--muted)"/>
    <text x="788" y="197" font-size="19" font-weight="600">internet</text>
    <text x="788" y="218" font-size="13" class="muted">visitors and scanners</text>

    <text x="90" y="194" class="caps" font-size="11" style="fill:var(--direct)">DIRECT · DNS ONLY</text>
    <text x="90" y="218" font-size="15" class="mono">whoami.linuxcloudhacks.ovh → WAN IP</text>

    <text x="1510" y="194" class="caps" font-size="11" text-anchor="end" style="fill:var(--cf)">VIA CLOUDFLARE · PROXIED</text>
    <text x="1510" y="218" font-size="15" class="mono" text-anchor="end">whoami-cf.linuxcloudhacks.ovh → Cloudflare edge</text>
  </g>

  <!-- ============ 2 · HOMELAB SHELL ============ -->
  <g data-step="2">
    <rect x="60" y="520" width="1480" height="340" rx="18" fill="url(#gHome)" stroke="#23405a"/>
    <text x="800" y="548" class="caps dim" text-anchor="middle">HOMELAB · DOCKER HOST 192.168.12.232</text>
  </g>

  <!-- ============ TRACKS + TRAFFIC (under the boxes) ============ -->
  <g data-step="3">
    <path class="track t-direct" d="M340 232 V640 H620"/>
    <circle r="4.2" fill="var(--direct)"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#mDirect"/></animateMotion></circle>
    <circle r="4.2" fill="var(--direct)"><animateMotion dur="3.2s" repeatCount="indefinite" begin="-1.07s"><mpath href="#mDirect"/></animateMotion></circle>
    <circle r="4.2" fill="var(--direct)"><animateMotion dur="3.2s" repeatCount="indefinite" begin="-2.13s"><mpath href="#mDirect"/></animateMotion></circle>
  </g>
  <g data-step="4">
    <path class="track t-cf" d="M1220 232 V440"/>
    <path class="track t-tunnel" d="M1220 440 V556"/>
    <path class="track t-cf" d="M1220 606 V660 H980"/>
    <circle r="4.2" fill="var(--cf)"><animateMotion dur="3.4s" repeatCount="indefinite" begin="-0.4s"><mpath href="#mCf"/></animateMotion></circle>
    <circle r="4.2" fill="var(--cf)"><animateMotion dur="3.4s" repeatCount="indefinite" begin="-1.53s"><mpath href="#mCf"/></animateMotion></circle>
    <circle r="4.2" fill="var(--cf)"><animateMotion dur="3.4s" repeatCount="indefinite" begin="-2.67s"><mpath href="#mCf"/></animateMotion></circle>
  </g>
  <g data-step="2">
    <path class="track" d="M800 690 V710" stroke="var(--muted)" stroke-opacity=".5" marker-end="url(#aLog)"/>
  </g>

  <!-- banned traffic: stops at the first wall it meets -->
  <g data-step="6">
    <circle r="4.6" fill="var(--bad)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="-0.7s"><mpath href="#mDropDirect"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="2.2s" repeatCount="indefinite" begin="-0.7s"/>
    </circle>
    <circle r="4.6" fill="var(--bad)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="-1.6s"><mpath href="#mDropCf"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="2.2s" repeatCount="indefinite" begin="-1.6s"/>
    </circle>
    <text x="354" y="256" font-size="12.5" font-weight="600" style="fill:var(--bad)">banned → dropped</text>
    <text x="1234" y="256" font-size="12.5" font-weight="600" style="fill:var(--bad)">banned → captcha</text>
  </g>

  <!-- ============ 2 · CADDY + WHOAMI ============ -->
  <g data-step="2">
    <rect x="620" y="590" width="360" height="100" rx="14" fill="#0d141d" stroke="#2a5566"/>
    <text x="644" y="622" font-size="22" font-weight="600">Caddy</text>
    <text x="956" y="621" class="caps" font-size="10" text-anchor="end" style="fill:var(--dim)">THE SENSOR</text>
    <text x="644" y="648" font-size="13.5" class="mono" style="fill:var(--direct)">:443 · TLS, Let's Encrypt</text>
    <text x="644" y="672" font-size="13.5" class="mono" style="fill:var(--cf)">:80 · real IP from CF-Connecting-IP</text>

    <rect x="720" y="712" width="160" height="40" rx="10" fill="var(--panel2)" stroke="#2a5566"/>
    <text x="800" y="738" font-size="16" class="mono" text-anchor="middle">whoami</text>
  </g>

  <!-- ============ 3 · DIRECT DOOR: MIKROTIK ============ -->
  <g data-step="3">
    <rect x="160" y="270" width="360" height="170" rx="18" fill="url(#gRouter)" stroke="#5a4830"/>
    <text x="186" y="302" class="caps" style="fill:var(--router)">ROUTER</text>
    <text x="186" y="336" font-size="26" font-weight="600">MikroTik RB5009</text>
    <text x="186" y="392" font-size="13.5" class="mono muted">port-forward tcp/443</text>
    <text x="186" y="414" font-size="13.5" class="mono muted">→ 192.168.12.232</text>
  </g>

  <!-- ============ 4 · CLOUDFLARE DOOR ============ -->
  <g data-step="4">
    <rect x="1000" y="270" width="440" height="170" rx="18" fill="url(#gCf)" stroke="#3c3466"/>
    <text x="1026" y="302" class="caps" style="fill:var(--cf)">CLOUDFLARE EDGE</text>
    <text x="1026" y="336" font-size="26" font-weight="600">Worker</text>
    <text x="1026" y="392" font-size="13.5" class="mono muted">route whoami-cf.linuxcloudhacks.ovh/*</text>
    <text x="1026" y="414" font-size="13.5" class="mono muted">checks every visitor first</text>

    <text x="760" y="340" class="caps dim" text-anchor="middle">TWO DOORS · ONE APP</text>
    <text x="760" y="370" font-size="15" class="muted" text-anchor="middle">the tunnel path never</text>
    <text x="760" y="391" font-size="15" class="muted" text-anchor="middle">touches the router</text>

    <text x="1236" y="484" font-size="13.5" font-weight="600" style="fill:var(--cf)">Cloudflare Tunnel</text>
    <text x="1236" y="503" font-size="12.5" class="muted">outbound · no open port</text>

    <rect x="1080" y="556" width="280" height="50" rx="10" fill="#0d141d" stroke="#3c3466"/>
    <text x="1220" y="576" class="caps" font-size="10" text-anchor="middle" style="fill:var(--cf)">CLOUDFLARED</text>
    <text x="1220" y="596" font-size="13.5" class="mono" text-anchor="middle">container on dmz_net</text>
  </g>

  <!-- ============ 5 · CROWDSEC ENGINE ============ -->
  <g data-step="5">
    <path class="track" d="M650 690 V770" stroke="var(--muted)" stroke-opacity=".6" stroke-dasharray="4 5" marker-end="url(#aLog)"/>
    <text x="636" y="736" font-size="13.5" class="mono" text-anchor="end">access.log</text>
    <text x="636" y="755" font-size="12.5" class="muted" text-anchor="end">real client IP</text>

    <rect x="470" y="774" width="660" height="70" rx="14" fill="url(#gEngine)" stroke="#2c5a3e"/>
    <use href="#shield" x="492" y="790" width="36" height="36" style="color:var(--good)"/>
    <text x="540" y="801" class="caps" style="fill:var(--good)">CROWDSEC ENGINE</text>
    <text x="540" y="827" font-size="15">reads the log → scenario → <tspan font-weight="600" style="fill:var(--good)">ban decision</tspan></text>
    <text x="1106" y="815" font-size="12.5" class="muted" text-anchor="end">one decision, 3 bouncers</text>
  </g>

  <!-- ============ 6 · THE THREE WALLS ============ -->
  <g data-step="6">
    <!-- decisions out to each wall -->
    <path class="feed" d="M470 798 H300 V610" marker-end="url(#aFeed)"/>
    <path class="feed" d="M470 822 H190 V444" marker-end="url(#aFeed)"/>
    <path class="feed" d="M1130 810 H1410 V444" marker-end="url(#aFeed)"/>
    <text x="312" y="722" font-size="12.5" style="fill:var(--good)">nftables bouncer</text>
    <text x="202" y="474" font-size="12.5" style="fill:var(--good)">MikroTik bouncer</text>
    <text x="1398" y="742" font-size="12.5" text-anchor="end" style="fill:var(--good)">Cloudflare Worker bouncer</text>

    <!-- wall 1: nftables on the homelab -->
    <rect x="230" y="556" width="290" height="50" rx="10" fill="#1a0f10" stroke="var(--bad)" stroke-opacity=".75"/>
    <text x="375" y="576" class="caps" font-size="10" text-anchor="middle" style="fill:var(--bad)">WALL 1 · NFTABLES</text>
    <text x="375" y="596" font-size="13.5" class="mono" text-anchor="middle">drop · input + forward</text>
    <g class="badge" transform="translate(230 556)"><circle r="12"/><text y="4.5">1</text></g>

    <!-- wall 2: RAW drop on the router -->
    <rect x="182" y="350" width="316" height="26" rx="6" fill="#1a0f10" stroke="var(--bad)" stroke-opacity=".75"/>
    <text x="194" y="368" font-size="13.5" class="mono" style="fill:var(--bad)">RAW drop · crowdsec-banned</text>
    <text x="500" y="302" class="caps" font-size="11" text-anchor="end" style="fill:var(--bad)">WALL 2</text>
    <g class="badge" transform="translate(160 270)"><circle r="12"/><text y="4.5">2</text></g>

    <!-- wall 3: captcha at the edge -->
    <rect x="1022" y="350" width="396" height="26" rx="6" fill="#1a0f10" stroke="var(--bad)" stroke-opacity=".75"/>
    <text x="1034" y="368" font-size="13.5" class="mono" style="fill:var(--bad)">banned → Turnstile captcha</text>
    <text x="1420" y="302" class="caps" font-size="11" text-anchor="end" style="fill:var(--bad)">WALL 3</text>
    <g class="badge" transform="translate(1000 270)"><circle r="12"/><text y="4.5">3</text></g>
  </g>
</svg>

<script>
  // Default: everything visible. Add ?build to reveal one step per click / → / space (← goes back).
  (function () {
    const svg = document.getElementById("root");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) svg.pauseAnimations();
    if (!new URLSearchParams(location.search).has("build")) return;
    const groups = [...document.querySelectorAll("[data-step]")];
    const max = Math.max(...groups.map(g => +g.dataset.step));
    let step = 0;
    const render = () => groups.forEach(g => g.classList.toggle("hidden", +g.dataset.step > step));
    const go = d => { step = Math.min(max, Math.max(0, step + d)); render(); };
    addEventListener("click", () => go(1));
    addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft") go(-1);
    });
    render();
  })();
</script>
</body>
</html>
