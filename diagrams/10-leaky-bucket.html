<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaky Bucket</title>
<!--
  Overlay for video. Options (combine with &):
    ?bg=black      (default) pure black  -> place as a panel, or use Screen/Lighten composite in Resolve
    ?bg=white      white background, dark ink
    ?bg=green      chroma green (#00b140), all colours opaque so it keys cleanly
    ?overflow      after the slow fill/leak, add a quick burst that overflows the bucket
    ?labels=0      bucket only, no text
    ?align=right   push the strip to the right edge of the window
    ?ip=1.2.3.4    IP shown on the bucket   ?event=404   label on each falling drop
-->
<style>
  :root {
    --bg: #000;
    --text: #e8eef5; --muted: #8a9ab0; --dim: #5b6b80;
    --rim: #c9d4e0; --line: #3a4a5e;
    --w1: #7fe3f2; --w2: #1f8fa8;           /* water, opaque */
    --r1: #ff9a8c; --r2: #b8382c;           /* overflow water */
    --drop: #5fd4e6; --bad: #ff7a6b; --pill: #101823;
  }
  :root[data-bg="white"] {
    --bg: #fff;
    --text: #0f1722; --muted: #4d5b6e; --dim: #8592a3;
    --rim: #253244; --line: #b7c2cf;
    --w1: #5cc9e0; --w2: #13738a;
    --r1: #f08a7c; --r2: #b02f24;
    --drop: #1a9fc0; --bad: #d6453a; --pill: #eef2f6;
  }
  :root[data-bg="green"] { --bg: #00b140; --dim: #c6d3e0; --muted: #e3ebf3; --line: #e3ebf3; --pill: #0b1220; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; justify-content: center; align-items: center; overflow: hidden; }
  :root[data-align="right"] body { justify-content: flex-end; }
  svg { height: 100vh; width: auto; aspect-ratio: 600 / 1080; display: block; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .caps { font-size: 20px; letter-spacing: 4px; font-weight: 600; }
  .lbl { transition: opacity .4s ease; }
</style>
</head>
<body>
<svg id="root" viewBox="0 0 600 1080" role="img"
     aria-label="A leaky bucket for one IP address. Each matching event falls in as a drop and raises the water level; one drop leaks out of a hole in the bottom at a steady pace, so the bucket slowly fills and slowly drains. A dashed line marks capacity 5. In overflow mode a quick burst fills it past capacity, it overflows, and an alert fires.">
  <defs>
    <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--w1)"/><stop offset="1" stop-color="var(--w2)"/>
    </linearGradient>
    <linearGradient id="gHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--r1)"/><stop offset="1" stop-color="var(--r2)"/>
    </linearGradient>
    <clipPath id="inside"><path d="M124 380 L173 816 L427 816 L476 380 Z"/></clipPath>
    <path id="dropShape" d="M0 -16 C6 -7 10 -2 10 4 A10 10 0 0 1 -10 4 C-10 -2 -6 -7 0 -16 Z"/>
  </defs>

  <g class="lbl" id="labelsTop">
    <text x="300" y="86" text-anchor="middle" class="caps" fill="var(--muted)">LEAKY BUCKET</text>
    <rect x="160" y="112" width="280" height="50" rx="25" fill="var(--pill)" stroke="var(--line)" stroke-width="1.5"/>
    <text id="ipText" x="300" y="145" text-anchor="middle" class="mono" font-size="22" font-weight="600">203.0.113.7</text>
    <text x="300" y="196" text-anchor="middle" font-size="18" fill="var(--muted)">one bucket per IP</text>
  </g>

  <path id="water" fill="url(#gWater)" clip-path="url(#inside)"/>
  <g id="fx"></g>

  <g class="lbl" id="capLabel">
    <line x1="128" y1="420" x2="472" y2="420" stroke="var(--dim)" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="300" y="408" text-anchor="middle" font-size="17" fill="var(--muted)">capacity 5</text>
  </g>

  <path id="bucket" d="M120 380 L170 820 L289 820 M311 820 L430 820 L480 380"
        fill="none" stroke="var(--rim)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="lbl" id="labelsBottom">
    <text x="322" y="905" font-size="17" fill="var(--muted)">leaks one drop</text>
    <text x="322" y="927" font-size="17" fill="var(--muted)">at a steady pace</text>
    <text id="counter" x="300" y="1040" text-anchor="middle" class="mono" font-size="40" font-weight="700">
      <tspan id="cNum">0</tspan><tspan fill="var(--dim)" font-size="28"> / 5</tspan>
    </text>
    <g id="alert" opacity="0">
      <rect x="110" y="1002" width="380" height="54" rx="27" fill="var(--bad)"/>
      <text id="alertText" x="300" y="1038" text-anchor="middle" font-size="22" font-weight="700" fill="#140808" letter-spacing="1">OVERFLOW → ALERT</text>
    </g>
  </g>
</svg>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  root.dataset.bg = q.get("bg") || "black";
  if (q.get("align")) root.dataset.align = q.get("align");
  const LABELS = q.get("labels") !== "0";
  const EVENT = q.get("event") || "failed login";
  if (q.get("ip")) document.getElementById("ipText").textContent = q.get("ip");
  if (!LABELS) document.querySelectorAll(".lbl").forEach(g => g.style.display = "none");

  // ---- geometry & timing --------------------------------------------------
  const CAP = 5, UNIT = 80, TOP = 380, BOT = 820, LEAK = 4, FALL = 0.9, SPAWN_Y = 230;
  const ARRIVALS = [1, 3, 4.5, 6, 7.5, 9.5, 14];          // slow trickle: peaks at 4, drains to 0
  const JITTER = [-34, 22, -8, 38, -22, 8, -40, 30, -14, 16, -28, 4, 34];
  let LOOP = 31;
  if (q.has("overflow")) { ARRIVALS.push(32, 32.5, 33, 33.5, 34, 34.5); LOOP = 46; }

  const $ = id => document.getElementById(id);
  const water = $("water"), fx = $("fx"), bucket = $("bucket"), cNum = $("cNum"),
        counter = $("counter"), alertG = $("alert"), alertText = $("alertText");
  const h = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || fx).appendChild(e);
    return e;
  };

  // ---- state ---------------------------------------------------------------
  let t, next, nextLeak, units, level, amp, overflowAt, anims;
  function reset() {
    t = 0; next = 0; nextLeak = LEAK; units = 0; overflowAt = null; amp = 0;
    if (level === undefined) level = 0;
    anims && anims.forEach(a => a.el.remove());
    anims = [];
    water.setAttribute("fill", "url(#gWater)");
    bucket.setAttribute("stroke", "var(--rim)");
    counter.setAttribute("opacity", 1); alertG.setAttribute("opacity", 0);
    cNum.removeAttribute("fill"); cNum.textContent = "0";
  }
  const surface = () => BOT - Math.min(level, 5.5) * UNIT;
  const setUnits = n => { units = n; cNum.textContent = n; };

  // ---- one-shot animations -------------------------------------------------
  function spawnDrop(i) {
    const x = 300 + JITTER[i % JITTER.length];
    const g = h("g", {});
    h("use", { href: "#dropShape", fill: "var(--drop)" }, g);
    if (LABELS) h("text", { x: 18, y: 6, "font-size": 16, fill: "var(--muted)" }, g).textContent = EVENT;
    anims.push({ el: g, t0: t, dur: FALL, step(p) {
      const y = SPAWN_Y + (surface() - SPAWN_Y) * p * p;
      g.setAttribute("transform", `translate(${x},${y})`);
      g.setAttribute("opacity", p < .12 ? p / .12 : 1);
    }, done() { land(x); } });
  }
  function land(x) {
    const y = surface();
    const ring = h("ellipse", { cx: x, cy: y, rx: 0, ry: 0, fill: "none", stroke: "var(--w1)", "stroke-width": 3 });
    anims.push({ el: ring, t0: t, dur: .55, step(p) {
      ring.setAttribute("rx", 8 + 34 * p); ring.setAttribute("ry", 2 + 6 * p); ring.setAttribute("opacity", 1 - p);
    } });
    amp = 7;
    if (overflowAt !== null) return;
    setUnits(units + 1);
    if (units > CAP) overflow();
  }
  function leak() {
    setUnits(units - 1);
    const d = h("use", { href: "#dropShape", fill: "var(--drop)" });
    anims.push({ el: d, t0: t, dur: 1.3, step(p) {
      // forms under the hole, then falls away
      const grow = Math.min(1, p / .3), fall = Math.max(0, (p - .3) / .7);
      const y = 826 + 10 * grow + 150 * fall * fall;
      d.setAttribute("transform", `translate(300,${y}) scale(${.4 + .45 * grow})`);
      d.setAttribute("opacity", 1 - fall);
    } });
  }
  function overflow() {
    overflowAt = t;
    water.setAttribute("fill", "url(#gHot)");
    bucket.setAttribute("stroke", "var(--bad)");
    cNum.setAttribute("fill", "var(--bad)");
    alertText.textContent = "OVERFLOW → ALERT";
    counter.setAttribute("opacity", 0); alertG.setAttribute("opacity", 1);
    for (const [x, dx] of [[120, -1], [480, 1], [126, -1], [474, 1], [122, -1], [478, 1]]) {
      const s = h("use", { href: "#dropShape", fill: "var(--r1)" });
      const v = 40 + Math.random() * 60, delay = Math.random() * .5;
      anims.push({ el: s, t0: t + delay, dur: 1.1, step(p) {
        s.setAttribute("transform", `translate(${x + dx * v * p},${374 + 260 * p * p}) scale(.7)`);
        s.setAttribute("opacity", Math.max(0, p < 0 ? 0 : 1 - p));
      } });
    }
  }

  // ---- frame loop ------------------------------------------------------------
  function wavePath(time) {
    if (level < 0.02) return "";
    const S = surface();
    let d = `M100 ${BOT + 10} L100 ${S}`;
    for (let x = 100; x <= 500; x += 10)
      d += ` L${x} ${(S + amp * Math.sin(x / 38 + time * 2.2) + amp * .5 * Math.sin(x / 17 - time * 3.1) + 2.5 * Math.sin(x / 55 + time * 1.3)).toFixed(1)}`;
    return d + ` L500 ${BOT + 10} Z`;
  }

  let last = null, clock = 0;
  function frame(now) {
    const dt = last === null ? 0 : Math.min(.1, (now - last) / 1000);
    last = now; t += dt; clock += dt;

    while (next < ARRIVALS.length && ARRIVALS[next] <= t) spawnDrop(next++);

    if (overflowAt === null) {
      if (t >= nextLeak) { if (units > 0) leak(); nextLeak += LEAK; }
    } else if (t - overflowAt > 3.5 && units > 0) {
      // bucket is spent after the alert: empty it before the loop restarts
      setUnits(0); cNum.removeAttribute("fill");
      alertText.textContent = "alert sent · bucket resets";
    }

    // water level eases toward the unit count (slower on the way down)
    const target = Math.min(units, 5.6);
    level += (target - level) * Math.min(1, dt * (target > level ? 4 : 1.6));
    amp += (1.6 - amp) * Math.min(1, dt * 1.8);
    water.setAttribute("d", wavePath(clock));

    const finished = [];
    anims = anims.filter(a => {
      const p = (t - a.t0) / a.dur;
      if (p < 0) { a.el.setAttribute("opacity", 0); return true; }
      a.step(Math.min(1, p));
      if (p >= 1) { a.el.remove(); if (a.done) finished.push(a.done); return false; }
      return true;
    });
    finished.forEach(fn => fn());   // may queue new animations

    if (t >= LOOP) reset();
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
