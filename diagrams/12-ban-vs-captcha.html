<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ban vs Captcha</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090d14;
    --panel: #101823;
    --panel2: #152130;
    --line: #243244;
    --text: #e8eef5;
    --muted: #8a9ab0;
    --dim: #5b6b80;
    --log: #5fd4e6;
    --ok: #6fe08a;
    --warn: #f2b45e;
    --bad: #ff7a6b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { fill: var(--muted); }
  .dim { fill: var(--dim); }
  .caps { font-size: 12px; letter-spacing: 2.4px; font-weight: 600; }
  .lane { stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
  .swap { transition: opacity .25s ease; }

  [data-step] { transition: opacity .45s ease; }
  .hidden { opacity: 0; }
</style>
</head>
<body>
<svg id="root" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="The two main CrowdSec decision types, set in profiles.yaml. Ban: a human with a browser and a bot script, both from the flagged IP 203.0.113.7, send requests; the bouncer drops all of them, so nothing reaches the server, on any port, and every bouncer can enforce it. Captcha: the same two visitors get a challenge page instead of a hard block; the human solves it and reaches the website with 200 OK, the bot fails the challenge and gets nothing. Captcha only works for websites.">
  <defs>
    <linearGradient id="gBan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22161a"/><stop offset="1" stop-color="#10141c"/>
    </linearGradient>
    <linearGradient id="gCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231d15"/><stop offset="1" stop-color="#11161f"/>
    </linearGradient>
  </defs>

  <!-- ============ HEADER ============ -->
  <g>
    <text x="60" y="78" class="caps" style="fill:var(--warn)">CROWDSEC LAB · DECISIONS</text>
    <text x="60" y="130" font-size="42" font-weight="600" letter-spacing="-1">Two kinds of decision</text>
    <text x="1540" y="78" font-size="14" class="muted" text-anchor="end">same flagged IP · two outcomes</text>
    <g transform="translate(1310,112)">
      <circle cx="0" cy="0" r="5" fill="var(--log)"/>
      <text x="12" y="5" font-size="14" class="muted">human</text>
      <circle cx="96" cy="0" r="5" fill="var(--bad)"/>
      <text x="108" y="5" font-size="14" class="muted">bot</text>
      <text x="230" y="5" font-size="14" class="muted" text-anchor="end">profiles.yaml</text>
    </g>
  </g>

  <g id="pBan" data-step="1" transform="translate(60,230)"></g>
  <g id="pCap" data-step="2" transform="translate(820,230)"></g>

</svg>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const IP = "203.0.113.7";
  const h = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const tween = (ms, fn) => new Promise(res => {
    const t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / ms); fn(p); p < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
  const fadeText = (parent, attrs, text, ms = 1100) => {
    const t = h("text", attrs, parent, text);
    return tween(ms, p => t.setAttribute("opacity", p < .15 ? p / .15 : p > .7 ? (1 - p) / .3 : 1)).then(() => t.remove());
  };

  // ---------------------------------------------------------------- shared panel chrome
  const LANES = { human: 178, bot: 278 };
  function chrome(g, cfg) {
    h("rect", { x: 0, y: 0, width: 720, height: 520, rx: 18, fill: `url(#${cfg.grad})`, stroke: cfg.stroke }, g);
    h("text", { x: 24, y: 40, class: "caps", fill: cfg.color }, g, cfg.caps);
    h("text", { x: 24, y: 76, "font-size": 26, "font-weight": 600 }, g, cfg.title);
    const sub = h("text", { x: 24, y: 104, "font-size": 13, class: "mono muted" }, g, "decisions:  ");
    h("tspan", { fill: cfg.color, "font-weight": 700 }, sub, "type: " + cfg.type);

    const client = (y, dot, name, sub) => {
      h("rect", { x: 24, y: y - 28, width: 176, height: 56, rx: 10, fill: "var(--panel2)", stroke: "var(--line)" }, g);
      h("circle", { cx: 44, cy: y, r: 5, fill: dot }, g);
      h("text", { x: 58, y: y - 4, "font-size": 15, "font-weight": 600 }, g, name);
      h("text", { x: 58, y: y + 15, "font-size": 11.5, class: "mono muted" }, g, sub);
    };
    client(LANES.human, "var(--log)", "human · browser", IP);
    client(LANES.bot, "var(--bad)", "bot · script", IP);

    cfg.bullets.forEach(([mark, color, text], i) => {
      const y = 404 + i * 40;
      h("text", { x: 34, y, "font-size": 20, "font-weight": 700, fill: color, "text-anchor": "middle" }, g, mark);
      h("text", { x: 58, y, "font-size": 20 }, g, text);
    });
    h("line", { x1: 24, y1: 356, x2: 696, y2: 356, stroke: "var(--line)" }, g);
  }

  const chip = (parent, label, who) => {
    const w = label.length * 7.6 + 18;
    const c = h("g", {}, parent);
    const r = h("rect", { x: 0, y: -11, width: w, height: 22, rx: 6, fill: "#0d141d",
                          stroke: who === "human" ? "var(--log)" : "var(--bad)", "stroke-opacity": .9 }, c);
    h("text", { x: 9, y: 4.5, "font-size": 12.5, class: "mono" }, c, label);
    return { el: c, rect: r, w };
  };
  const move = (c, x0, x1, y, ms) =>
    tween(ms, p => c.el.setAttribute("transform", `translate(${x0 + (x1 - x0) * ease(p)},${y})`));
  const vanish = async c => { await tween(380, p => c.el.setAttribute("opacity", 1 - p)); c.el.remove(); };

  // ---------------------------------------------------------------- BAN panel
  const B = document.getElementById("pBan");
  chrome(B, {
    grad: "gBan", stroke: "#4a2a2e", color: "var(--bad)", caps: "BAN", type: "ban",
    title: "Blocked completely",
    bullets: [
      ["✕", "var(--bad)", "nothing gets through, on any port"],
      ["✕", "var(--bad)", "humans and bots alike"],
      ["✓", "var(--ok)", "every bouncer can enforce it"]
    ]
  });
  h("line", { x1: 206, y1: LANES.human, x2: 318, y2: LANES.human, class: "lane" }, B);
  h("line", { x1: 206, y1: LANES.bot, x2: 318, y2: LANES.bot, class: "lane" }, B);
  h("line", { x1: 348, y1: LANES.human, x2: 514, y2: LANES.human, class: "lane", opacity: .35 }, B);
  h("line", { x1: 348, y1: LANES.bot, x2: 514, y2: LANES.bot, class: "lane", opacity: .35 }, B);
  // wall
  h("text", { x: 333, y: 134, class: "caps", fill: "var(--bad)", "text-anchor": "middle" }, B, "BOUNCER");
  const wall = h("rect", { x: 322, y: 146, width: 22, height: 166, rx: 5, fill: "var(--bad)", "fill-opacity": .85 }, B);
  for (let y = 160; y < 312; y += 22) h("line", { x1: 322, y1: y, x2: 344, y2: y, stroke: "#22161a", "stroke-width": 2 }, B);
  // server
  h("rect", { x: 520, y: 146, width: 176, height: 166, rx: 12, fill: "#0d141d", stroke: "var(--line)" }, B);
  h("text", { x: 540, y: 176, class: "caps dim" }, B, "YOUR SERVER");
  h("text", { x: 540, y: 222, "font-size": 18, "font-weight": 600, class: "muted" }, B, "nothing");
  h("text", { x: 540, y: 246, "font-size": 18, "font-weight": 600, class: "muted" }, B, "arrives");
  h("text", { x: 540, y: 290, "font-size": 12.5, class: "mono dim" }, B, "SSH · HTTPS · any");
  const bFlow = h("g", {}, B);

  async function banShot(who, label) {
    const y = LANES[who];
    const c = chip(bFlow, label, who);
    await move(c, 210, 316 - c.w, y, 560);
    wall.setAttribute("fill-opacity", 1);
    const ring = h("circle", { cx: 318, cy: y, r: 4, fill: "none", stroke: "var(--bad)", "stroke-width": 2.5 }, bFlow);
    tween(450, p => { ring.setAttribute("r", 4 + 22 * p); ring.setAttribute("opacity", 1 - p); }).then(() => ring.remove());
    c.rect.setAttribute("fill", "#2a1214"); c.rect.setAttribute("stroke", "var(--bad)");
    fadeText(bFlow, { x: 380, y: y + 5, "font-size": 14, "font-weight": 600, fill: "var(--bad)" }, "✕ dropped", 1000);
    setTimeout(() => wall.setAttribute("fill-opacity", .85), 200);
    await vanish(c);
  }

  // ---------------------------------------------------------------- CAPTCHA panel
  const C = document.getElementById("pCap");
  chrome(C, {
    grad: "gCap", stroke: "#4d3d22", color: "var(--warn)", caps: "CAPTCHA", type: "captcha",
    title: "A challenge instead of a wall",
    bullets: [
      ["✓", "var(--ok)", "a real human solves it and gets in"],
      ["✕", "var(--bad)", "a bot usually doesn't"],
      ["!", "var(--warn)", "websites only"]
    ]
  });
  h("line", { x1: 206, y1: LANES.human, x2: 274, y2: LANES.human, class: "lane" }, C);
  h("line", { x1: 206, y1: LANES.bot, x2: 274, y2: LANES.bot, class: "lane" }, C);
  h("line", { x1: 474, y1: LANES.human, x2: 514, y2: LANES.human, class: "lane" }, C);
  // challenge page (mini browser window)
  const card = h("rect", { x: 280, y: 132, width: 190, height: 192, rx: 10, fill: "#0d141d", stroke: "var(--warn)", "stroke-opacity": .8 }, C);
  h("path", { d: "M280 158 H470", stroke: "var(--line)" }, C);
  [296, 310, 324].forEach(x => h("circle", { cx: x, cy: 145, r: 4, fill: "var(--line)" }, C));
  h("text", { x: 375, y: 194, "font-size": 16, "font-weight": 600, "text-anchor": "middle" }, C, "Are you human?");
  const box = h("rect", { x: 304, y: 214, width: 26, height: 26, rx: 5, fill: "none", stroke: "var(--muted)", "stroke-width": 2 }, C);
  const tick = h("path", { d: "M309 227 L315 234 L326 220", fill: "none", stroke: "var(--ok)", "stroke-width": 3.5,
                           "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": 30, "stroke-dashoffset": 30 }, C);
  h("text", { x: 342, y: 232, "font-size": 14, class: "muted" }, C, "verify me");
  const status = h("text", { x: 375, y: 298, "font-size": 14, "font-weight": 700, "text-anchor": "middle", class: "swap", opacity: 0 }, C, "");
  // website
  const site = h("rect", { x: 520, y: 146, width: 176, height: 166, rx: 12, fill: "#0d141d", stroke: "var(--line)" }, C);
  h("text", { x: 540, y: 176, class: "caps", fill: "var(--ok)" }, C, "WEBSITE");
  h("text", { x: 540, y: 222, "font-size": 18, "font-weight": 600 }, C, "real page");
  const okPill = h("g", { class: "swap", opacity: 0 }, C);
  h("rect", { x: 540, y: 240, width: 74, height: 26, rx: 13, fill: "var(--ok)", "fill-opacity": .18, stroke: "var(--ok)" }, okPill);
  h("text", { x: 577, y: 258, "text-anchor": "middle", "font-size": 13, "font-weight": 700, class: "mono", fill: "var(--ok)" }, okPill, "200 OK");
  h("text", { x: 540, y: 290, "font-size": 12.5, class: "mono dim" }, C, "HTTP only");
  const cFlow = h("g", {}, C);

  const setStatus = (txt, color) => { status.textContent = txt; status.setAttribute("fill", color); status.setAttribute("opacity", txt ? 1 : 0); };

  async function capHuman() {
    const y = LANES.human, c = chip(cFlow, "GET /", "human");
    await move(c, 210, 276 - c.w, y, 520);
    c.el.remove();
    card.setAttribute("stroke-opacity", 1);
    setStatus("solving…", "var(--muted)");
    await wait(450);
    await tween(320, p => tick.setAttribute("stroke-dashoffset", 30 * (1 - p)));
    box.setAttribute("stroke", "var(--ok)");
    setStatus("✓ solved", "var(--ok)");
    const dot = h("circle", { cx: 476, cy: y, r: 6, fill: "var(--ok)" }, cFlow);
    await tween(340, p => dot.setAttribute("cx", 476 + 38 * ease(p)));
    dot.remove();
    site.setAttribute("stroke", "var(--ok)");
    okPill.setAttribute("opacity", 1);
    await wait(900);
    site.setAttribute("stroke", "var(--line)"); okPill.setAttribute("opacity", 0);
    tick.setAttribute("stroke-dashoffset", 30); box.setAttribute("stroke", "var(--muted)");
    setStatus("", "var(--muted)"); card.setAttribute("stroke-opacity", .8);
  }
  async function capBot() {
    const y = LANES.bot, c = chip(cFlow, "GET /.env", "bot");
    await move(c, 210, 276 - c.w, y, 520);
    card.setAttribute("stroke", "var(--bad)");
    setStatus("✕ failed", "var(--bad)");
    c.rect.setAttribute("fill", "#2a1214");
    // tiny shake of the chip against the page
    const x = 276 - c.w;
    await tween(360, p => c.el.setAttribute("transform", `translate(${x + Math.sin(p * Math.PI * 6) * 5 * (1 - p)},${y})`));
    await vanish(c);
    await wait(500);
    card.setAttribute("stroke", "var(--warn)"); setStatus("", "var(--muted)");
  }

  // ---------------------------------------------------------------- loop
  async function run() {
    for (;;) {
      while (document.hidden) await wait(400);
      banShot("human", "GET /"); capHuman();
      await wait(2800);
      banShot("bot", "GET /.env"); capBot();
      await wait(2400);
    }
  }
  if (RM) { tick.setAttribute("stroke-dashoffset", 0); setStatus("✓ human solved · ✕ bot failed", "var(--muted)"); okPill.setAttribute("opacity", 1); }
  else run();

  // Default: everything visible. Add ?build to reveal one step per click / → / space (← goes back).
  if (!new URLSearchParams(location.search).has("build")) return;
  const groups = [...document.querySelectorAll("[data-step]")];
  const max = Math.max(...groups.map(g => +g.dataset.step));
  let step = 0;
  const render = () => groups.forEach(g => g.classList.toggle("hidden", +g.dataset.step > step));
  const go = d => { step = Math.min(max, Math.max(0, step + d)); render(); };
  addEventListener("click", () => go(1));
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
    if (e.key === "ArrowLeft") go(-1);
  });
  render();
})();
</script>
</body>
</html>
